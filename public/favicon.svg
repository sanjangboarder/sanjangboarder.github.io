<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f1a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Stylized 'S' Fishing Hook / Wave Emblem -->
  <g filter="url(#shadow)">
    <!-- Top arc of S -->
    <path d="M 86 42 C 86 31 74 25 61 25 C 44 25 36 34 36 45 C 36 57 46 63 60 67 L 68 70 C 80 73 92 80 92 93 C 92 106 80 113 63 113 C 45 113 36 102 36 93" 
          fill="none" 
          stroke="url(#glow)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Hook barb / dynamic accent dot -->
    <circle cx="86" cy="42" r="5" fill="#38bdf8" />
    <circle cx="36" cy="93" r="5" fill="#c7d2fe" />
    
    <!-- Luminous center sparkle -->
    <polygon points="64,36 67,46 77,49 67,52 64,62 61,52 51,49 61,46" fill="#ffffff" opacity="0.9" />
  </g>
</svg>